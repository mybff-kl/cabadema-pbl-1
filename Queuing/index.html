<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNLTD 199 | Queue</title>

  <!-- Google Font (needs internet). If offline, the browser uses a fallback font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <!-- SCREEN 1: Enter number of people dining -->
  <main class="kiosk-screen">

    <!-- LOGO: put logo.png in this folder with your own logo -->
    <div class="logo-area">
      <img class="logo-image" src="logo.png" alt="UNLTD 199 Samgyupsal Korean Grill House">
      <div class="logo-fallback">UNLTD 199<small>Samgyupsal Korean Grill House</small></div>
    </div>

    <!-- HEADING TEXT: change the words here -->
    <h1 class="screen-title">Please provide the number of people dining:</h1>

    <div class="keypad-wrapper">

      <!-- Shows the digits the customer types -->
      <div class="keypad-display" id="keypad-display" aria-live="polite"></div>

      <!-- Number buttons. data-key is read by script.js -->
      <div class="keypad-grid">
        <button class="keypad-button" data-key="1">1</button>
        <button class="keypad-button" data-key="2">2</button>
        <button class="keypad-button" data-key="3">3</button>
        <button class="keypad-button" data-key="4">4</button>
        <button class="keypad-button" data-key="5">5</button>
        <button class="keypad-button" data-key="6">6</button>
        <button class="keypad-button" data-key="7">7</button>
        <button class="keypad-button" data-key="8">8</button>
        <button class="keypad-button" data-key="9">9</button>

        <!-- Empty cell so the 0 sits in the middle column -->
        <span></span>
        <button class="keypad-button" data-key="0">0</button>

        <!-- Backspace button -->
        <button class="keypad-button" data-key="backspace" aria-label="Delete last digit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/>
            <path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>
          </svg>
        </button>
      </div>

      <div class="keypad-actions">
        <!-- BUTTON TEXT: change "Generate Queue Number" here -->
        <button class="button button--primary" id="generate-button">Generate Queue Number</button>
      </div>
    </div>

  </main>

  <!-- Small pop-up message for errors -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
